<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Budget Calculator</title>
    <!-- Link to your external CSS file -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <div class="calculator-container">
        <h1>Campus Budget Calculator</h1>
        <p class="subtitle">Know exactly what you are spending before hitting the market</p>

        <!-- Input field for total budget -->
        <div class="form-group">
            <label id="budget-label" for="pocketMoney">Total Money You Have (₦)</label>
            <input type="number" id="pocketMoney" class="budget-input" placeholder="e.g., 30000" min="0">
        </div>

        <!-- Container where items from script.js will be injected -->
        <label class="section-title">Select Quantities of Items to Buy</label>
        <div class="catalog-list" id="list"></div>

        <!-- Action Button that triggers the calculation -->
        <button class="calc-btn" id="calculateBtn">Calculate Total Spending</button>

        <!-- Hidden result box that opens when calculation runs -->
        <div id="resultBox" class="result-box">
            <p class="result-title" id="resultTitle"></p>
            <p class="result-meta" id="totalText"></p>
            <p class="result-meta" id="balanceText"></p>
            <div class="receipt-breakdown" id="receipt"></div>
        </div>
    </div>

    <!-- Link to your external JavaScript file -->
    <script type="module" src="js/script.js"></script>
    <script type="module" src="js/logic.js"></script>
</body>
</html>
